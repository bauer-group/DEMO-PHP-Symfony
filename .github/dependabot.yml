# =============================================================================
# Dependabot Configuration
# =============================================================================
# Automated dependency updates for Docker images and Composer packages.
#
# Commit prefixes decide whether a merged update is released
# (docker-maintenance.yml dispatches docker-release.yml after the merge):
#   docker         -> fix(docker): PATCH release, the image is rebuilt
#   composer       -> fix(deps): PATCH release - the production image
#                     installs the runtime packages from composer.lock;
#                     dev-only packages (prefix-development: PHPUnit,
#                     debug and maker bundles) -> chore(deps-dev)
#   github-actions -> chore(actions): no release, never auto-merged
# =============================================================================

version: 2

updates:
  # Docker image updates
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:50"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "fix(docker)"
    labels:
      - "dependencies"
      - "docker"

  # Composer package updates
  - package-ecosystem: "composer"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:50"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "php"
    groups:
      symfony:
        patterns:
          - "symfony/*"
      doctrine:
        patterns:
          - "doctrine/*"
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:50"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
      - "github-actions"
