# =============================================================================
# Docker Release Pipeline
# =============================================================================
# Validates, builds, and releases Docker images for the PHP Todo App.
#
# Uses reusable workflows from bauer-group/automation-templates
# =============================================================================

name: Docker Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'Force a new release even without conventional commits'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  # Required by docker-build.yml@main: a declared permissions: block sets every
  # unlisted scope to none, and the reusable workflow now needs these three.
  attestations: write   # write the build-provenance attestation
  id-token: write       # OIDC token to sign the attestation (keyless/Sigstore)
  actions: read         # its nested security-analysis job reads run metadata

jobs:
  # ---------------------------------------------------------------------------
  # Validate Docker Compose Files
  # ---------------------------------------------------------------------------
  validate-compose:
    name: Validate Compose Files
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: |
        [
          "docker-compose.coolify.yml",
          "docker-compose.traefik.yml",
          "docker-compose.development.yml"
        ]
      env-template: |
        {
          "STACK_NAME": "todo-app",
          "SERVICE_HOSTNAME": "todo.example.com",
          "TIME_ZONE": "Etc/UTC",
          "MYSQL_ROOT_PASSWORD": "test-root-password",
          "MYSQL_DATABASE": "todo_db",
          "MYSQL_USER": "todo_user",
          "MYSQL_PASSWORD": "test-password",
          "APP_ENV": "prod",
          "APP_SECRET": "test-secret-key",
          "APP_DEBUG": "0",
          "APP_PORT": "8080",
          "DB_PORT": "3306",
          "XDEBUG_PORT": "9003",
          "PMA_PORT": "8081",
          "PROXY_NETWORK": "EDGEPROXY"
        }
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Validate Shell Scripts
  # ---------------------------------------------------------------------------
  validate-scripts:
    name: Validate Shell Scripts
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-shellscript.yml@main
    with:
      scan-directory: '.'
      severity: 'warning'
    secrets: inherit

  # ---------------------------------------------------------------------------
  # PHPUnit Test Suite (app/tests)
  # ---------------------------------------------------------------------------
  # Inline instead of automation-templates' php-build.yml: Symfony's Dotenv
  # needs app/.env before composer's auto-scripts run, and php-build.yml has
  # no step for that (it also bundles PHPCS/PHPStan gates this repo has no
  # configuration for). Runs on pushes too, so a red suite blocks a release.
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read PHP version from composer.json
        id: php
        run: |
          constraint=$(jq -r '.require.php' composer.json)
          version=$(printf '%s' "$constraint" | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::Cannot derive a PHP version from require.php '$constraint'"
            exit 1
          fi
          echo "require.php '$constraint' -> PHP $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          extensions: intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Create app/.env
        # Symfony's Dotenv refuses to boot without app/.env (gitignored);
        # the dev container creates it from the same template.
        run: cp .env.dev .env

      - name: Install dependencies
        # Includes the auto-scripts (importmap:install fills assets/vendor/,
        # which every page rendering base.html.twig needs).
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage

  # ---------------------------------------------------------------------------
  # Semantic Release
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [validate-compose, validate-scripts, phpunit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Build and Push Docker Image (Release)
  # ---------------------------------------------------------------------------
  docker-build-release:
    name: Build Docker Image (Release)
    needs: [release]
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: ${{ github.repository }}/todo-demo
      release-version: ${{ needs.release.outputs.version }}
      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true
      dockerfile-path: './app/Dockerfile'
      docker-context: './app'
      # The Dockerfile ends with the 'development' stage (Xdebug, no vendor/),
      # so without an explicit target BuildKit builds that one. 'production'
      # runs composer install from composer.lock and is the shipped image.
      build-target: 'production'
      platforms: 'linux/amd64'
      push: true
      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      # NOTE: Cache disabled - self-hosted runners have connectivity issues
      # with GitHub's cache infrastructure (HTTP 502 errors)
      cache-enabled: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Build Docker Image (PR Validation)
  # ---------------------------------------------------------------------------
  docker-build-pr:
    name: Build Docker Image (PR)
    needs: [validate-compose, validate-scripts]
    if: github.event_name == 'pull_request'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: ${{ github.repository }}/todo-demo
      auto-tags: true
      dockerfile-path: './app/Dockerfile'
      docker-context: './app'
      # The Dockerfile ends with the 'development' stage (Xdebug, no vendor/),
      # so without an explicit target BuildKit builds that one. 'production'
      # runs composer install from composer.lock and is the shipped image.
      build-target: 'production'
      platforms: 'linux/amd64'
      push: false
      security-scan: false
      security-fail-on: 'CRITICAL'
      # NOTE: Cache disabled - self-hosted runners have connectivity issues
      # with GitHub's cache infrastructure (HTTP 502 errors)
      cache-enabled: false
    secrets: inherit
