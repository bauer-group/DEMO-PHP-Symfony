# =============================================================================
# Docker Maintenance - Dependabot Auto-Merge
# =============================================================================
# Decides on every Dependabot PR - base image and Composer updates in app/ -
# and merges those whose PR CI passed.
#
# A merge made with the GITHUB_TOKEN starts no push workflow, so after the
# merge this workflow dispatches docker-release.yml on main and waits for it
# (release-workflow). That run validates, tests and builds the merged
# commit again and only then:
# 1. Creates a semantic release (fix(docker) / fix(deps) -> PATCH)
# 2. Builds and pushes the new todo-demo image
# A release run that does not succeed turns this job red.
#
# Uses reusable workflows from bauer-group/automation-templates
# =============================================================================

name: Docker Maintenance

on:
  # No paths filter: every Dependabot PR, whatever its ecosystem, reaches the
  # module and gets an explicit decision and annotation instead of silently
  # staying open. The module merges only what docker-release.yml built and
  # tested on the PR head; GitHub Actions updates and other .github/ changes
  # always stay open for a manual merge. PRs not opened by Dependabot skip
  # the job.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites of the PR head commit
  statuses: read        # commit statuses of the PR head commit
  actions: write        # dispatch the release; read workflow runs

jobs:
  dependabot-auto-merge:
    name: Auto-Merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - for
      # every PR that touches app/ it builds the production image (composer
      # install from composer.lock) and runs the PHPUnit suite.
      required-workflows: '.github/workflows/docker-release.yml'
      # After a merge - and only then - dispatch the release on main and
      # wait for it: it rebuilds the merged commit before it releases it,
      # and a failed release run fails this job.
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
